# Render Blueprint: https://render.com/docs/blueprint-spec
# After first deploy, set APP_KEY in the dashboard (see RENDER_DEPLOY.md).

databases:
  - name: automate-db
    databaseName: automate
    user: automate
    plan: free

services:
  - type: web
    name: automate
    runtime: php
    plan: free
    buildCommand: chmod +x render-build.sh render-start.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: AutoMate
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Replace with your real service URL after Render assigns it (e.g. https://automate.onrender.com)
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: automate-db
          property: connectionString
      # Safer defaults on a single web instance (no extra worker). Enable Reverb/queue workers later if needed.
      - key: BROADCAST_CONNECTION
        value: log
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
