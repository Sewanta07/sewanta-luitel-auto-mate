# Full-stack AutoMate on Render: Postgres + Laravel web + queue worker + Laravel Reverb (WebSockets).
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: New → Blueprint → connect repo (root must contain this file).
#
# After first successful deploy:
# 1. Copy the public hostname of "automate-reverb" (e.g. automate-reverb.onrender.com).
# 2. On "automate-web", set REVERB_HOST to that hostname (no https://). Redeploy web with "Clear build cache"
#    so the Docker build picks up REVERB_APP_KEY + REVERB_HOST for the Vite client bundle.
# 3. On "automate-reverb", set REVERB_HOST to the same hostname (required for correct Reverb config).
#
# Note: FILESYSTEM_DISK=local uses ephemeral disk; uploaded files are lost on redeploy unless you use S3 (AWS_*).
#
# If managed Postgres is unavailable in your region, remove the `databases` block and set DATABASE_URL manually.

envVarGroups:
  - name: automate-core
    envVars:
      - key: APP_KEY
        sync: false
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false

  - name: automate-mail
    envVars:
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: AutoMate

databases:
  - name: automate-postgres
    databaseName: automate
    user: automate

services:
  - type: web
    name: automate-web
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /up
    envVars:
      - fromGroup: automate-core
      - fromGroup: automate-mail
      - key: APP_NAME
        value: AutoMate
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: automate-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_HOST
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ESEWA_MERCHANT_NAME
        value: AutoMate
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: ESEWA_FORM_URL
        value: https://rc-epay.esewa.com.np/api/epay/main/v2/form
      - key: ESEWA_STATUS_CHECK_URL
        value: https://rc.esewa.com.np/api/epay/transaction/status/
      - key: BILLING_COMPANY_NAME
        value: AutoMate
      - key: BILLING_COMPANY_TAGLINE
        value: Vehicle Service & Rental Management
      - key: BILLING_COMPANY_ADDRESS
        sync: false
      - key: BILLING_COMPANY_PHONE
        sync: false
      - key: BILLING_COMPANY_EMAIL
        sync: false
      - key: BILLING_COMPANY_VAT
        sync: false
      - key: BILLING_COMPANY_WEBSITE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_BUCKET
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"

  - type: worker
    name: automate-queue
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    envVars:
      - fromGroup: automate-core
      - fromGroup: automate-mail
      - key: APP_NAME
        value: AutoMate
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: automate-postgres
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

  - type: web
    name: automate-reverb
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerCommand: /bin/sh -c '(php artisan config:cache || true) && export REVERB_SERVER_PORT=$PORT REVERB_PORT=$PORT && exec php artisan reverb:start --host=0.0.0.0 --port=$PORT'
    envVars:
      - fromGroup: automate-core
      - key: APP_NAME
        value: AutoMate
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: automate-postgres
          property: connectionString
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_HOST
        sync: false
